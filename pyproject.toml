[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "denoising-diffusion-pytorch"
version = "0.27.4"
description = "Denoising diffusion probabilistic models for EEG-conditioned image generation"
readme = "README.md"
requires-python = "==3.14.*"
license = "MIT"
authors = [{ name = "DevJake" }]
keywords = ["artificial intelligence", "diffusion", "EEG", "generative models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.15.0,<2",
    "einops>=0.8.2,<0.9",
    "ema-pytorch>=0.8.3,<0.9",
    "pillow>=13.0.0,<14",
    "torch>=2.14.1,<3",
    "torchvision>=0.29.1,<1",
    "tqdm>=4.70.1,<5",
]

[project.optional-dependencies]
preprocessing = [
    "matplotlib>=3.11.2,<4",
    "mne>=1.13.2,<2",
    "numpy>=2.5.4,<3",
    "pillow>=13.0.0,<14",
    "tqdm>=4.70.1,<5",
]
tracking = ["wandb>=0.31.0,<0.32"]

[project.urls]
Repository = "https://github.com/DevJake/EEG-diffusion-pytorch"

[dependency-groups]
audit = ["pip-audit==2.10.1"]
dev = [
    "build==1.6.1",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.uv]
required-version = "==0.13.5"

[tool.hatch.build.targets.wheel]
packages = ["denoising_diffusion_pytorch", "util"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
